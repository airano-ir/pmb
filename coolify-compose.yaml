# Coolify deployment compose for pmb.palebluedot.live
#
# Deliberately separate from the upstream `compose.yaml` (which is a local dev
# stack: bind-mounts the repo over /app, binds the dashboard to 127.0.0.1, and
# leaves the MCP server on stdio). Keeping this in its own file means upstream
# merges never conflict with the deploy config.
#
# Why compose and not the Dockerfile build pack: the image's CMD is ["bash"]
# (upstream overrides it per-service), and Coolify's dockerfile renderer applies
# neither the start command nor `-v` named-volume binds -- the container ran bare
# `bash`, exited instantly, and crash-looped. The compose build pack uses this
# file verbatim, so both the command and the volumes survive every redeploy.

services:
  pmb-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Installs the `fastembed` extra (ONNX runtime) -- see the command
        # block below for why we embed via fastembed and not torch.
        PIP_EXTRAS: fastembed
    # Three things happen before the server starts, all idempotent:
    #
    # 1. Clear the stale singleton registry. PMB's own guard
    #    (src/pmb/mcp/registry.py) writes $PMB_HOME/servers.json keyed by PID
    #    to stop a second server binding the same port. PMB_HOME is the
    #    PERSISTENT volume, but every container restart gets a fresh PID
    #    namespace starting at 1 -- so the main process is always PID 1, the
    #    liveness check (os.kill(1, 0)) against the OLD container's leftover
    #    entry always succeeds, and pmb-mcp refuses to start ("already
    #    running... pid 1"), exits 0, and restart:unless-stopped loops
    #    forever. A fresh container boot has no legitimately-running prior
    #    process.
    #
    # 2. Pin the embedding runtime to fastembed (ONNX) instead of
    #    sentence-transformers (torch). Observed live: the server started
    #    cleanly, answered `initialize`, then the connection was severed
    #    mid-request on the first `recall` -- the call that synchronously
    #    loads the embedding model, exactly the shape upstream documents at
    #    config.py:911 ("a write spawned a full torch model load ...
    #    pressure"). Same MiniLM weights, same 384 dims as the default, so NO
    #    reindex is needed. The model id is kept MULTILINGUAL on purpose:
    #    fastembed's own default (all-MiniLM-L6-v2) is ENGLISH-ONLY and would
    #    silently degrade Persian recall -- upstream measured 8/10 vs 10/10
    #    top-1 on non-Latin queries with that default and ships a doctor
    #    check for exactly this mistake (src/pmb/health/multilingual_check.py).
    # NOTE: $$ (not $) below is deliberate. Docker Compose interpolates any
    # $VAR in a command string against the BUILD HOST's environment before
    # the container ever sees it -- confirmed live: a bare $PMB_HOME here
    # produced a build-time warning ("PMB_HOME variable is not set,
    # defaulting to blank"), silently turning the rm into `rm -f
    # "/servers.json"` (wrong path, quiet no-op) instead of the intended
    # $PMB_HOME/servers.json inside the container. $$ escapes it to a literal
    # $ that survives into the container's own shell.
    # DIAGNOSTIC WRAPPER (temporary): recall() still kills the process with a
    # raw connection reset (curl: "error code: 520", no JSON-RPC error body)
    # even with fastembed instead of torch -- ruling out the torch-load theory
    # entirely. A silent connection reset (not a clean exception) suggests a
    # native crash (segfault) rather than a Python-level OOM/exception, most
    # likely in lancedb's pyarrow native extension, which recall() also
    # touches and which the fastembed swap never addressed. Coolify's log API
    # returns 400 for a crash-looping app, so: run pmb-mcp in the background,
    # tee its output to a file, and if it dies, fall back to serving that file
    # over the same port so `curl https://pmb.palebluedot.live/pmb-crash.log`
    # can read the real traceback. Revert to a plain `exec pmb-mcp` once the
    # actual cause is found.
    command:
      - sh
      - -c
      - |
        set -e
        rm -f "$$PMB_HOME/servers.json"
        pmb config set embedding.backend fastembed
        pmb config set embedding.fastembed_model sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        pmb-mcp > /tmp/pmb-crash.log 2>&1
        echo "EXIT_CODE=$$?" >> /tmp/pmb-crash.log
        exec python3 -m http.server 8765 --directory /tmp
    environment:
      - PMB_HOME=/data
      - HF_HOME=/hf-cache
      - SENTENCE_TRANSFORMERS_HOME=/hf-cache
      - PMB_MCP_TRANSPORT=streamable-http
      - PMB_MCP_HOST=0.0.0.0
      - PMB_MCP_PORT=8765
      - PMB_MCP_PATH=/mcp
      - 'PMB_MCP_BEARER_TOKEN=${PMB_MCP_BEARER_TOKEN}'
    expose:
      - "8765"
    volumes:
      - pmb_data:/data
      - pmb_hf_cache:/hf-cache
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.pmb-mcp-http.entrypoints=http
      - traefik.http.routers.pmb-mcp-http.rule=Host(`pmb.palebluedot.live`)
      - traefik.http.routers.pmb-mcp-http.middlewares=pmb-mcp-redirect-to-https
      - traefik.http.routers.pmb-mcp-http.service=pmb-mcp
      - traefik.http.middlewares.pmb-mcp-redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.pmb-mcp-https.entrypoints=https
      - traefik.http.routers.pmb-mcp-https.rule=Host(`pmb.palebluedot.live`)
      - traefik.http.routers.pmb-mcp-https.tls=true
      - traefik.http.routers.pmb-mcp-https.tls.certresolver=letsencrypt
      - traefik.http.routers.pmb-mcp-https.service=pmb-mcp
      - traefik.http.services.pmb-mcp.loadbalancer.server.port=8765
    healthcheck:
      # The /mcp endpoint is bearer-gated, so probe the listening socket instead
      # of an HTTP status. python3 is in the image; curl/wget need not be.
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 5).close()"]
      interval: 15s
      timeout: 10s
      retries: 5
      # First boot downloads the sentence-transformers embedding model.
      start_period: 300s

volumes:
  pmb_data:
  pmb_hf_cache:
