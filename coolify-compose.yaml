# Coolify deployment compose for pmb.palebluedot.live
#
# Deliberately separate from the upstream `compose.yaml` (which is a local dev
# stack: bind-mounts the repo over /app, binds the dashboard to 127.0.0.1, and
# leaves the MCP server on stdio). Keeping this in its own file means upstream
# merges never conflict with the deploy config.
#
# Why compose and not the Dockerfile build pack: the image's CMD is ["bash"]
# (upstream overrides it per-service), and Coolify's dockerfile renderer applies
# neither the start command nor `-v` named-volume binds -- the container ran bare
# `bash`, exited instantly, and crash-looped. The compose build pack uses this
# file verbatim, so both the command and the volumes survive every redeploy.
#
# Embedding backend is Ollama (embedding.backend=ollama), NOT torch or
# fastembed/ONNX. Root cause, confirmed via a captured crash log: this VPS's
# CPU is Intel Ivy Bridge with AVX but no AVX2/FMA. Both sentence-transformers
# (torch) and fastembed (ONNX Runtime) are compiled assuming AVX2 and crash
# with "Illegal instruction (core dumped)" / SIGILL / exit 132 the instant the
# embedding model runs -- not an OOM, not a config issue, a hardware ISA
# mismatch no software config on PMB's side can fix. Ollama runs on llama.cpp,
# which does runtime CPU feature detection (cpuid) instead of hard-requiring
# AVX2, so it works on this CPU. See airano-ir/ollama-deploy for that service
# (internal-network alias `ollama`, port 11434, no public domain -- reached
# over the shared `coolify` Docker network, same pattern as this app's own
# internal reachability).
services:
  pmb-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Clear the stale singleton registry before every start. PMB's own guard
    # (src/pmb/mcp/registry.py) writes $PMB_HOME/servers.json keyed by PID to
    # stop a second server binding the same port. PMB_HOME is the PERSISTENT
    # volume, but every container restart gets a fresh PID namespace starting
    # at 1 -- so the main process is always PID 1, the liveness check
    # (os.kill(1, 0)) against the OLD container's leftover entry always
    # succeeds, and pmb-mcp refuses to start ("already running... pid 1"),
    # exits 0, and restart:unless-stopped loops forever. A fresh container
    # boot has no legitimately-running prior process, so this is always safe.
    #
    # $$ (not $) is deliberate: Docker Compose interpolates any $VAR in a
    # command string against the BUILD HOST's environment before the
    # container ever sees it. A bare $PMB_HOME here silently became
    # `rm -f "/servers.json"` (wrong path, quiet no-op) -- confirmed via a
    # build-time warning ("PMB_HOME variable is not set, defaulting to
    # blank"). $$ escapes it to a literal $ that survives into the
    # container's own shell, where PMB_HOME correctly expands from the
    # environment: block below.
    #
    # `pmb config set --global` (not the bare form, which defaults to
    # per-WORKSPACE config keyed by cwd -- the running MCP server resolves
    # its OWN workspace independently and would never see a workspace-scoped
    # override written from this shell's cwd).
    command:
      - sh
      - -c
      - |
        rm -f "$$PMB_HOME/servers.json"
        pmb config set --global embedding.backend ollama
        pmb config set --global embedding.ollama_model bge-m3
        pmb config set --global embedding.ollama_url http://ollama:11434
        # bge-m3, not nomic-embed-text: the user's usage is Persian-heavy, and
        # bge-m3 is explicitly multilingual (nomic-embed-text is English-
        # oriented) -- same class of mistake PMB's own
        # health/multilingual_check.py exists to catch for the
        # sentence-transformers backend, just one layer up at model choice.
        # 1024-dim vs MiniLM's 384-dim; the engine detects dimension from the
        # live model rather than assuming EMBED_DIM (see search.py's table
        # creation comment: "This lets ollama (768) / openai (1536) backends
        # work on a fresh workspace" -- bge-m3's 1024 follows the same path).
        # `pmb reindex` regenerates vectors from existing event content
        # non-destructively, so any prior writes survive. Marker-gated so
        # restarts don't redo it. Now safe to run: lancedb-compat (Dockerfile)
        # no longer SIGILLs on import, so reindex can actually open the vector
        # table. bge-m3 is 1024-dim vs the old MiniLM 384-dim table -- reindex
        # drops and regenerates vectors so the dimensions line up (otherwise
        # new writes can't be added to a 384-dim table and recall's vector
        # signal stays 0.0).
        if [ ! -f "$$PMB_HOME/.reindexed-ollama" ]; then
          pmb reindex && touch "$$PMB_HOME/.reindexed-ollama"
        fi
        exec pmb-mcp
    environment:
      - PMB_HOME=/data
      - HF_HOME=/hf-cache
      - SENTENCE_TRANSFORMERS_HOME=/hf-cache
      - PMB_MCP_TRANSPORT=streamable-http
      - PMB_MCP_HOST=0.0.0.0
      - PMB_MCP_PORT=8765
      - PMB_MCP_PATH=/mcp
      - 'PMB_MCP_BEARER_TOKEN=${PMB_MCP_BEARER_TOKEN}'
    expose:
      - "8765"
    volumes:
      - pmb_data:/data
      - pmb_hf_cache:/hf-cache
    restart: unless-stopped
    # Two shared networks, each for a specific internal reachability need:
    # - `coolify`: to resolve `ollama` by DNS alias (the embedding backend
    #   service airano-ir/ollama-deploy joins `coolify`). Coolify still
    #   auto-attaches its own per-resource UUID network for Traefik regardless
    #   of what's listed here (confirmed from prior renders of this compose).
    # - `hermes-shared`: so code-server and hermes-agent can reach `pmb-mcp`
    #   by DNS alias for the INTERNAL MCP path
    #   (http://pmb-mcp:8765/mcp) without a Cloudflare round-trip. Both
    #   clients already join `hermes-shared` (code-server for the Hermes
    #   bridge, hermes-agent for Chromium CDP) -- confirmed by inspecting each
    #   service's rendered compose. Neither is on `coolify`, so joining
    #   `hermes-shared` here (rather than `coolify` there) is the lower blast-
    #   radius move: only THIS service redeploys, code-server and Hermes stay
    #   up. Adding PMB to a network both clients already share is enough --
    #   a compose service's name registers as a DNS alias on every network it
    #   joins, so `pmb-mcp` becomes resolvable from any container on
    #   `hermes-shared` the moment this redeploy finishes.
    networks:
      - coolify
      - hermes-shared
    labels:
      - traefik.enable=true
      # Two HTTPS routers, split by priority so the MCP API path stays
      # reachable with a Bearer token (PMB's own auth) while EVERYTHING ELSE
      # (/, /healthz, /internal/health, any future dashboard) sits behind
      # Traefik basic auth. PMB's daemon exempts /, /healthz, /internal/health
      # from its bearer check (for healthchecks) -- so without basic auth
      # those would be an unauthenticated information surface. basic-auth
      # closes it; the /mcp router bypasses basic-auth so MCP clients that
      # send `Authorization: Bearer <token>` aren't rejected by Traefik's
      # basic-auth check before PMB ever sees the request.
      #
      # Router priority: higher wins. /mcp gets 100, catch-all gets 10.
      - traefik.http.routers.pmb-mcp-http.entrypoints=http
      - traefik.http.routers.pmb-mcp-http.rule=Host(`pmb.palebluedot.live`)
      - traefik.http.routers.pmb-mcp-http.middlewares=pmb-mcp-redirect-to-https
      - traefik.http.routers.pmb-mcp-http.service=pmb-mcp
      - traefik.http.middlewares.pmb-mcp-redirect-to-https.redirectscheme.scheme=https
      # /mcp API -- NO basic auth, bearer-gated by PMB. High priority.
      - traefik.http.routers.pmb-mcp-api.entrypoints=https
      - traefik.http.routers.pmb-mcp-api.rule=Host(`pmb.palebluedot.live`) && PathPrefix(`/mcp`)
      - traefik.http.routers.pmb-mcp-api.priority=100
      - traefik.http.routers.pmb-mcp-api.tls=true
      - traefik.http.routers.pmb-mcp-api.tls.certresolver=letsencrypt
      - traefik.http.routers.pmb-mcp-api.service=pmb-mcp
      # Everything else -- basic auth required. Lower priority catch-all.
      # NOTE: the UI lives on the SEPARATE pmb-dashboard service below, which
      # claims /ui, /api and /static at priority 50 (above this catch-all,
      # below /mcp). This router is the fallback for everything neither
      # claims: /, /healthz, /internal/health.
      - traefik.http.routers.pmb-mcp-dashboard.entrypoints=https
      - traefik.http.routers.pmb-mcp-dashboard.rule=Host(`pmb.palebluedot.live`)
      - traefik.http.routers.pmb-mcp-dashboard.priority=10
      - traefik.http.routers.pmb-mcp-dashboard.middlewares=pmb-mcp-basicauth
      - traefik.http.routers.pmb-mcp-dashboard.tls=true
      - traefik.http.routers.pmb-mcp-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.pmb-mcp-dashboard.service=pmb-mcp
      # Basic auth users. Using htpasswd {SHA} scheme (base64) -- NOT apr1/bcrypt,
      # because those embed `$` chars and Coolify's `is_container_label_escape`
      # double-escapes `$$` into `$$$$` in the rendered label, corrupting the
      # hash. {SHA} has no `$`, so no escaping ambiguity. Creds in
      # /config/.claude/state/pmb-basic-auth.
      - traefik.http.middlewares.pmb-mcp-basicauth.basicauth.users=pmb-admin:{SHA}58Uub2B0j4p5cvA46MpmKlGO2NI=
      - traefik.http.services.pmb-mcp.loadbalancer.server.port=8765
    healthcheck:
      # The /mcp endpoint is bearer-gated, so probe the listening socket instead
      # of an HTTP status. python3 is in the image; curl/wget need not be.
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 5).close()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ------------------------------------------------------------------------
  # Web UI (`pmb dashboard`) -- the SECOND half of upstream PMB.
  #
  # Upstream ships two separate long-running commands over the same store:
  # `pmb-mcp` (the machine-facing MCP server, the service above) and
  # `pmb dashboard` (the human-facing web UI -- memory graph, git-style
  # timeline, recall debugger, per-event inspector). They are distinct
  # processes and BOTH default to port 8765, so they cannot be one container;
  # this service runs the UI on 8766 instead.
  #
  # Shares `pmb_data` with pmb-mcp on purpose: one memory store, two faces.
  # The UI shows exactly what the agents write over MCP, live. SQLite in WAL
  # mode handles the two writers; dashboard write traffic is human-paced
  # (occasional pin/archive clicks), so contention is negligible.
  #
  # Pure stdlib (http.server) -- no extra deps, no torch. It builds from the
  # same image as pmb-mcp, so the lancedb-compat fix (docker/Dockerfile)
  # applies here too; without it, opening the UI's graph/recall views would
  # SIGILL exactly like recall() did.
  pmb-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # --host 0.0.0.0 so Traefik (a different container) can reach it -- the
    # CLI default is 127.0.0.1, which would only ever accept connections from
    # inside this container. Public exposure is fine here BECAUSE the Traefik
    # router below forces basic auth; the dashboard itself has NO auth of its
    # own (upstream assumes localhost-only), so that middleware is the ONLY
    # thing standing in front of a full read+write memory UI. Never route it
    # without pmb-mcp-basicauth attached.
    #
    # --port 8766, not 8765: avoids colliding with pmb-mcp when both are up.
    command:
      - sh
      - -c
      - |
        exec pmb dashboard --host 0.0.0.0 --port 8766
    environment:
      - PMB_HOME=/data
      - HF_HOME=/hf-cache
      - SENTENCE_TRANSFORMERS_HOME=/hf-cache
    expose:
      - "8766"
    volumes:
      - pmb_data:/data
      - pmb_hf_cache:/hf-cache
    restart: unless-stopped
    networks:
      - coolify
      - hermes-shared
    labels:
      - traefik.enable=true
      # Priority 50: above the pmb-mcp catch-all (10), below /mcp (100).
      #
      # The rule claims THREE prefixes, not just /ui, because the dashboard's
      # HTML calls absolute paths -- its JS helper is
      # `async function api(p,o){return (await fetch(p,o||{})).json();}`
      # invoked as `api('/api/stats')`. So /api must reach this service or
      # every panel in the UI breaks. /static is the same story for assets.
      # (Upstream assumes it owns the whole origin at localhost:8765; we're
      # sharing an origin with the MCP server, hence the explicit carve-out.)
      - traefik.http.routers.pmb-dashboard.entrypoints=https
      - traefik.http.routers.pmb-dashboard.rule=Host(`pmb.palebluedot.live`) && (PathPrefix(`/ui`) || PathPrefix(`/api`) || PathPrefix(`/static`))
      - traefik.http.routers.pmb-dashboard.priority=50
      - traefik.http.routers.pmb-dashboard.tls=true
      - traefik.http.routers.pmb-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.pmb-dashboard.service=pmb-dashboard
      # StripPrefix /ui ONLY. The dashboard serves its HTML at `/`, so a
      # request for /ui must arrive as / -- but /api and /static must pass
      # through UNTOUCHED (they're already the paths the server expects).
      # Traefik's stripprefix only strips a prefix that actually matches, so
      # listing just /ui leaves the other two alone.
      - traefik.http.routers.pmb-dashboard.middlewares=pmb-ui-strip,pmb-mcp-basicauth
      - traefik.http.middlewares.pmb-ui-strip.stripprefix.prefixes=/ui
      - traefik.http.services.pmb-dashboard.loadbalancer.server.port=8766
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8766), 5).close()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  pmb_data:
  pmb_hf_cache:

networks:
  coolify:
    external: true
  hermes-shared:
    external: true
