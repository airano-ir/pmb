code: uk
name: Ukrainian
not_proper:
- звідки
- подобається
- сьогодні
- їх
- її
verb_synonyms:
  decide:
  - вирішив
  - вирішили
  deploy:
  - розгортаємо
  lead:
  - очолює
  live:
  - мешкає
  - переїхав
  - переїхала
  - переїхали
  migrate:
  - мігрував
  - мігрували
  name:
  - ім'я
  own:
  - володіти
  think:
  - вважає
  use:
  - використовуємо
  - використовується
  work:
  - працює
  - працюєш
name_statement_patterns:
- '\bмене\s+звати\s+(?P<name>[А-ЯЁІЇЄҐA-Z][\w]+)'
self_markers:
- мене
- мені
- мною
self_re_markers:
- мене
- мені
- мною
# hooks/auto_recall.py intent-classifier regex fragments (L1) — UK side.
intent_past_query:
- '\bколи\s+я'
- '\bщо\s+я\s+(?:робив|зробив)'
- '\bхто\s+так(?:ий|а)'
intent_recent_query:
- '\bщо\s+ми\s+(?:щойно|тільки\s+що)'
intent_goals_query:
- '\bяк[іи]\s+у\s+мене\s+цілі'
- '\bщо\s+(?:залиш\w+|дал[іи]|дороб\w+)'
intent_lessons_query:
- '\bяк[іи]\s+правила'
work_verb_markers:
- '\b(?:виправ|напиши|допиши|додай|рефактор|оновити)'
trivial_acks:
- привіт
- 'добрий\s+день'
- дякую
- зрозуміло
# L1 remainder — UK side. recall_qwords / recall_first_person extend the
# personal-intent gate to Ukrainian (additive — never touches the RU set);
# pamvr_first_person + self_intent_markers RELOCATE the UK fragments that used
# to live inline in pamvr.py.
recall_qwords:
- який
- яка
- яке
- які
- коли
- де
- куди
- звідки
- скільки
- чий
- чия
recall_first_person:
- мене
- мені
- мій
- моя
- моє
- моїх
- мою
pamvr_first_person:
- мене
- мені
- мною
self_intent_markers:
- коли я
- 'де я (?:живу|працюю|був|була)'
- 'мій\s+\w+'
- 'моя\s+\w+'
- 'мої\s+\w+'
entities_folder_stopwords:
- робочий
- стіл
- документи
- завантаження
pdf_heading_words:
- Розділ
fact_extract_patterns:
- re: \b(?:мене|його|її|їх|нас)\s+зват[иь]?\s+(?P<name>[А-ЯІЇЄҐ][а-яіїєґ']+(?:\s+[А-ЯІЇЄҐ][а-яіїєґ']+)?)
  kind: uk_identity
  template: 'Ім''я: {name}'
  flags: i
- re: (?:^|(?<=[.,])\s+)(?:я|він|вона|вони)\s+працю(?:ю|є|ють)\s+(?P<role>[а-яіїєґ'][а-яіїєґ'\s]{2,30}?)(?=[.,;]|\s+(?:у|в|на|і|та|але)\s+|$)
  kind: uk_role
  template: 'Робота: {role}'
  flags: i
- re: (?:^|(?<=[.,])\s+)(?P<subj>[А-ЯІЇЄҐ][а-яіїєґ']+(?:\s+[А-ЯІЇЄҐ][а-яіїєґ']+)?)\s+працює\s+(?P<role>[а-яіїєґ'][а-яіїєґ'\s]{2,30}?)(?=[.,;]|\s+(?:у|в|на|і|та)\s+|$)
  kind: uk_role_named
  template: '{subj} працює {role}'
  flags: ''
- re: (?:^|(?<=[.,])\s+)(?:я|він|вона|вони)\s+жив\w{1,3}\s+(?:у|в|на)\s+(?P<place>[А-ЯІЇЄҐ][а-яіїєґА-ЯІЇЄҐ'\-\s]{1,30}?)(?=[.,;]|\s+(?:і|та|але)\s+|$)
  kind: uk_location
  template: Живе у {place}
  flags: i
- re: (?:^|(?<=[.,])\s+)(?P<subj>[А-ЯІЇЄҐ][а-яіїєґ']+(?:\s+[А-ЯІЇЄҐ][а-яіїєґ']+)?)\s+жив\w{1,3}\s+(?:у|в|на)\s+(?P<place>[А-ЯІЇЄҐ][а-яіїєґА-ЯІЇЄҐ'\-\s]{1,30}?)(?=[.,;]|\s+(?:і|та|але)\s+|$)
  kind: uk_location_named
  template: '{subj} живе у {place}'
  flags: ''
- re: (?:^|(?<=[.,])\s+)(?P<subj>[А-ЯІЇЄҐ][а-яіїєґ']+(?:\s+[А-ЯІЇЄҐ][а-яіїєґ']+)?)\s+(?:переїхав|переїхала|переїхали|перебрався)\s+(?:до|в|у)\s+(?P<place>[А-ЯІЇЄҐ][а-яіїєґА-ЯІЇЄҐ'\-\s]{1,30}?)(?=[.,;]|$)
  kind: uk_moved
  template: '{subj} переїхав до {place}'
  flags: ''
- re: (?:^|(?<=[.,])\s+|\b)(?:мій|його|її)\s+день\s+народженн[яі]\s*[-—:]?\s*(?P<date>\d{1,2}\s+(?:січня|лютого|березня|квітня|травня|червня|липня|серпня|вересня|жовтня|листопада|грудня)(?:\s+\d{4})?)
  kind: uk_birthday
  template: 'День народження: {date}'
  flags: i
- re: (?:^|(?<=[.,])\s+|\b)(?:я\s+люблю|мені\s+подобає(?:ться|ться)|мені\s+подобаються)\s+(?P<thing>[а-яіїєґ'А-ЯІЇЄҐ][а-яіїєґ'А-ЯІЇЄҐ\s]{2,40}?)(?=[.,;]|$)
  kind: uk_preference
  template: 'Вподобання: {thing}'
  flags: i
- re: (?:^|(?<=[.,])\s+|\b)(?:мій|моя|мої|її|його)\s+(?P<rel>друг|подруга|дружина|чоловік|сестра|брат|мама|тато|син|донька|кіт|кішка|собака)\s+(?:\-|—|звати|звуть)?\s*(?P<name>[А-ЯІЇЄҐ][а-яіїєґ']+)
  kind: uk_relation
  template: '{rel}: {name}'
  flags: i
sentence_uppercase:
- ІЇЄҐ
