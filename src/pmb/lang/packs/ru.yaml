fact_extract_patterns:
- re: \b(?:меня|его|её|их|нас)\s+зовут\s+(?P<name>[А-ЯЁ][а-яё]+(?:\s+[А-ЯЁ][а-яё]+)?)
  kind: ru_identity
  template: 'Имя: {name}'
  flags: i
- re: (?:^|(?<=[.,])\s+)(?:я|он|она|они)\s+работа(?:ю|ет|ют)\s+(?P<role>[а-яё][а-яё\s]{2,30}?)(?=[.,;]|\s+(?:в|на|и|но|а)\s+|$)
  kind: ru_role
  template: 'Работа: {role}'
  flags: i
- re: (?:^|(?<=[.,])\s+)(?P<subj>[А-ЯЁ][а-яё]+(?:\s+[А-ЯЁ][а-яё]+)?)\s+работает\s+(?P<role>[а-яё][а-яё\s]{2,30}?)(?=[.,;]|\s+(?:в|на|и|но)\s+|$)
  kind: ru_role_named
  template: '{subj} работает {role}'
  flags: ''
- re: (?:^|(?<=[.,])\s+)(?:я|он|она|они)\s+жив\w{1,3}\s+(?:в|во|на)\s+(?P<place>[А-ЯЁ][а-яёА-ЯЁ\-\s]{1,30}?)(?=[.,;]|\s+(?:и|но|а)\s+|$)
  kind: ru_location
  template: Живёт в {place}
  flags: i
- re: (?:^|(?<=[.,])\s+)(?P<subj>[А-ЯЁ][а-яё]+(?:\s+[А-ЯЁ][а-яё]+)?)\s+жив\w{1,3}\s+(?:в|во|на)\s+(?P<place>[А-ЯЁ][а-яёА-ЯЁ\-\s]{1,30}?)(?=[.,;]|\s+(?:и|но|а)\s+|$)
  kind: ru_location_named
  template: '{subj} живёт в {place}'
  flags: ''
- re: (?:^|(?<=[.,])\s+)(?P<subj>[А-ЯЁ][а-яё]+(?:\s+[А-ЯЁ][а-яё]+)?)\s+(?:переехал[аи]?|перебрался)\s+(?:в|во|на)\s+(?P<place>[А-ЯЁ][а-яёА-ЯЁ\-\s]{1,30}?)(?=[.,;]|$)
  kind: ru_moved
  template: '{subj} переехал в {place}'
  flags: ''
- re: (?:^|(?<=[.,])\s+|\b)(?:мой|его|её|их)\s+день\s+рождени[яе]\s*[-—:]?\s*(?P<date>\d{1,2}\s+(?:января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)(?:\s+\d{4})?)
  kind: ru_birthday
  template: 'День рождения: {date}'
  flags: i
- re: (?:^|(?<=[.,])\s+|\b)(?:я|мне)\s+(?:люблю|нравится|нравятся|предпочитаю)\s+(?P<thing>[а-яёА-ЯЁ][а-яёА-ЯЁ\s]{2,40}?)(?=[.,;]|$)
  kind: ru_preference
  template: 'Предпочтение: {thing}'
  flags: i
- re: (?:^|(?<=[.,])\s+|\b)(?:мой|моя|мои|её|его)\s+(?P<rel>друг|подруга|жена|муж|сестра|брат|мама|папа|сын|дочь|кот|кошка|собака)\s+(?:\-|—|зовут)?\s*(?P<name>[А-ЯЁ][а-яё]+)
  kind: ru_relation
  template: '{rel}: {name}'
  flags: i
- re: (?:^|(?<=[.,])\s+|\b)[уУ]\s+(?:меня|него|неё|нас|них)\s+(?P<rel>кот|кошка|собака|друг|подруга|жена|муж|сын|дочь|сестра|брат)\s+(?:по\s+имени\s+|зовут\s+)?(?P<name>[А-ЯЁ][а-яё]+)
  kind: ru_possession
  template: '{rel}: {name}'
  flags: i
sentence_uppercase:
- А-Я
