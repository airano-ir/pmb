# hooks/auto_recall.py intent-classifier regex fragments (L1). The module
# keeps its English alternatives inline and joins these RU fragments in.
intent_past_query:
- '\bкогда\s+(?:я|мы|это)'
- '\bчто\s+(?:я|мы)\s+(?:делал|сделал|говорил|записал|выбрал|решил|обсужд)'
- '\bпочему\s+(?:мы|я)\s+(?:выбра|реши|отказа)'
- '\bкакой\s+у\s+меня'
- '\bгде\s+(?:я|мы)\s+(?:храни|записа|положи)'
- '\bкто\s+так(?:ой|ая)'
- '\bчто\s+я\s+планировал'
intent_recent_query:
- '\bчто\s+(?:мы|я)\s+(?:только\s+что|сейчас|щас|недавно)'
