name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs on the same ref — saves Actions minutes on rapid pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------
  # Lint — fast, runs once. Doesn't gate other jobs.
  # --------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "ruff>=0.8"
      - run: ruff check src tests scripts --output-format=github
        continue-on-error: true

  # --------------------------------------------------------------
  # Regression + feature suites - the must-pass tests.
  # These verify the headline features (PAMVR, keyed-upsert, warmup,
  # durable queue, chunked IN, pattern split, connect, sync, import).
  # --------------------------------------------------------------
  test:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # One macOS (arm64) job so the "runs on macOS" claim is tested,
          # without tripling runner minutes across every Python version.
          - os: macos-latest
            python: "3.12"

    # Stability on memory-constrained runners. transformers materialises model
    # weights in several parallel threads (GLOBAL_WORKERS); under the runners'
    # limited RAM that spiked peak memory and segfaulted with a native "access
    # violation" / pagefile-too-small. conftest.py caps GLOBAL_WORKERS=1; these
    # env vars also pin BLAS/tokenizer threads, and faulthandler turns any
    # remaining native crash into a readable Python traceback instead of a bare
    # exit code.
    env:
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~\AppData\Local\huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,crypto]"

      - name: Hardening regression suite
        run: pytest tests/test_hardening.py -q --tb=short

      - name: Connect + workspace-sync + encryption suite
        run: >
          pytest tests/test_connect.py tests/test_connect_codex.py
          tests/test_connect_rules.py tests/test_connect_extended.py
          tests/test_connect_active.py
          tests/test_git_sync.py tests/test_encryption.py -q --tb=short

      - name: Import + explain + embedder-backend suite
        run: >
          pytest tests/test_import.py tests/test_pamvr_explain.py
          tests/test_embedder_backends.py -q --tb=short

      - name: Provenance + watch + memory-quality + distill suite
        run: >
          pytest tests/test_provenance_watch.py tests/test_memory_quality.py
          tests/test_distill.py -q --tb=short

      - name: Local-use feature commands suite
        run: pytest tests/test_local_features.py -q --tb=short

      - name: J-score levers suite (resolved date / atomic patterns / validity windows)
        run: pytest tests/test_jscore_levers.py -q --tb=short

      - name: MCP end-to-end suite (tool exposure / session_brief / recall via in-memory client)
        run: pytest tests/test_mcp_e2e.py -q --tb=short

      - name: Keyed-memory + write-quality suite (A/E)
        run: >
          pytest tests/test_negation_tombstones.py
          tests/test_keyed_close_negation.py tests/test_keyed_suggestions_llm.py
          tests/test_keyed_canonical.py tests/test_quality_gate.py
          tests/test_declutter.py tests/test_plans_as_goals.py
          tests/test_identity_boost_names.py -q --tb=short

      - name: Daemon + durable-writes suite (B)
        run: pytest tests/test_write_outbox.py tests/test_daemon.py -q --tb=short

      - name: Language packs + Unicode tokenization suite (C)
        run: >
          pytest tests/test_unicode_tokenization.py tests/test_language_packs.py
          -q --tb=short

      - name: MCP token-diet + recall/intent follow-ups (D/C5)
        run: >
          pytest tests/test_toolspec_budget.py tests/test_mcp_compaction.py
          tests/test_recall_singleflight.py tests/test_semantic_intent.py
          -q --tb=short

      - name: Lightweight tests (no heavy ML)
        run: pytest tests/test_config.py tests/test_redact.py -q --tb=short

  # --------------------------------------------------------------
  # CLI smoke — entry points must work.
  # --------------------------------------------------------------
  smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: pmb --help
      - run: pmb config list
      - run: pmb stats || true   # empty workspace is OK
      - run: pmb doctor || true  # warnings allowed
