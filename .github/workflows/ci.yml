name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs on the same ref — saves Actions minutes on rapid pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------
  # Lint — fast, runs once. Doesn't gate other jobs.
  # --------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "ruff>=0.8"
      - run: ruff check src tests scripts --output-format=github
        continue-on-error: true

  # --------------------------------------------------------------
  # Regression + feature suites - the must-pass tests.
  # These verify the headline features (PAMVR, keyed-upsert, warmup,
  # durable queue, chunked IN, pattern split, connect, sync, import).
  # --------------------------------------------------------------
  test:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~\AppData\Local\huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,crypto]"

      - name: Hardening regression suite
        run: pytest tests/test_hardening.py -q --tb=short

      - name: Connect + workspace-sync + encryption suite
        run: >
          pytest tests/test_connect.py tests/test_connect_codex.py
          tests/test_connect_rules.py tests/test_connect_extended.py
          tests/test_git_sync.py tests/test_encryption.py -q --tb=short

      - name: Import + explain + embedder-backend suite
        run: >
          pytest tests/test_import.py tests/test_pamvr_explain.py
          tests/test_embedder_backends.py -q --tb=short

      - name: Provenance + watch + memory-quality + distill suite
        run: >
          pytest tests/test_provenance_watch.py tests/test_memory_quality.py
          tests/test_distill.py -q --tb=short

      - name: Local-use feature commands suite
        run: pytest tests/test_local_features.py -q --tb=short

      - name: Lightweight tests (no heavy ML)
        run: pytest tests/test_config.py tests/test_redact.py -q --tb=short

  # --------------------------------------------------------------
  # CLI smoke — entry points must work.
  # --------------------------------------------------------------
  smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: pmb --help
      - run: pmb config list
      - run: pmb stats || true   # empty workspace is OK
      - run: pmb doctor || true  # warnings allowed
