# Material for MkDocs config. Docs live in docs/ and deploy to GitHub Pages via
# .github/workflows/docs.yml. Enable once: Settings -> Pages -> Source: GitHub
# Actions. Site: https://oleksiijko.github.io/pmb/
site_name: PMB
site_description: Local-first persistent memory for AI coding agents, with SQLite as the source of truth, no cloud, and measurable impact.
site_url: https://oleksiijko.github.io/pmb/
repo_url: https://github.com/oleksiijko/pmb
repo_name: oleksiijko/pmb
edit_uri: edit/main/docs/
copyright: Apache-2.0 licensed. Local-first. You own every byte.

theme:
  name: material
  logo: assets/PMB_LOGO_BLACK.svg
  favicon: assets/PMB_LOGO_BLACK.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tooltips
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oleksiijko/pmb
      name: PMB on GitHub

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js
  - javascripts/mermaid-init.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: pmb-mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Internal notes stay in the repo but are not part of the published site.
exclude_docs: |
  _config.yml
  HARDENING_NOTES.md
  assistant-integration-notes.md

nav:
  - Home: README.md
  - Guide:
      - guide/index.md
      - Getting started: guide/getting-started.md
      - Usage: guide/usage.md
      - Dashboard: guide/dashboard.md
      - Deleting memories: guide/deleting-memories.md
      - Team and remote: guide/TEAM.md
      - Ollama: guide/SETUP_OLLAMA.md
      - Troubleshooting: guide/troubleshooting.md
  - Concepts:
      - concepts/index.md
      - Architecture: concepts/architecture.md
      - How it works: concepts/how-it-works.md
      - Does PMB help?: concepts/measuring-impact.md
      - Memory model: concepts/memory-model.md
      - Core engine: concepts/core-engine.md
      - Design and technology: concepts/design-and-tech.md
      - Privacy and security: concepts/privacy-and-security.md
  - Reference:
      - reference/index.md
      - Commands: reference/COMMANDS.md
      - MCP tools: reference/mcp-tools.md
      - Configuration: reference/configuration.md
  - Contributing:
      - contributing/index.md
      - Adding a language: contributing/adding-a-language.md
  - Roadmap: ROADMAP.md
